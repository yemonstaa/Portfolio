<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Portfolio | Responsive preview</title><style>*{box-sizing:border-box}body{margin:0;background:#e9edf5;color:#182238;font:14px/1.5 system-ui,sans-serif}header{padding:18px 24px;background:#fff;border-bottom:1px solid #dbe2ef;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}h1{font-size:16px;margin:0}p{margin:3px 0 0;color:#5c6578;font-size:12px}.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}button,a{font:inherit;border:1px solid #c5cee2;background:white;color:#2447bc;text-decoration:none;border-radius:6px;padding:9px 12px;min-height:44px;cursor:pointer}button[aria-pressed="true"]{background:#3558db;color:white;border-color:#3558db}:focus-visible{outline:3px solid #6a82db;outline-offset:3px}.stage{overflow:auto;padding:24px 18px 40px}.device{width:max-content;margin:auto;padding:8px;background:#182238;border-radius:22px;box-shadow:0 20px 55px #18223820}iframe{display:block;width:390px;height:780px;border:0;border-radius:15px;background:#f7f8fc}#status{text-align:center;min-height:24px;margin:14px 0;color:#435474;font-size:12px}</style></head><body><header><div><h1>Portfolio · Responsive preview</h1><p>The real website at different screen widths. Scroll inside the preview.</p></div><div class="controls" aria-label="Preview width"><button data-width="320" aria-pressed="false">Small phone</button><button data-width="390" aria-pressed="true">Phone</button><button data-width="768" aria-pressed="false">Tablet</button><button data-width="1120" aria-pressed="false">Desktop</button><a href="./" target="_blank" rel="noopener">Open website ↗</a></div></header><p id="status" role="status">Loading phone preview…</p><div class="stage"><div class="device"><iframe title="Live portfolio preview" src="index.html"></iframe></div></div><script>var frame=document.querySelector('iframe');var statusText=document.getElementById('status');function check(){try{var d=frame.contentDocument.documentElement;var w=frame.contentWindow.innerWidth;statusText.textContent=w+' px viewport · '+(d.scrollWidth>w?'Horizontal overflow detected':'No horizontal overflow');}catch(e){statusText.textContent='Preview ready';}}frame.addEventListener('load',check);document.querySelectorAll('[data-width]').forEach(function(button){button.addEventListener('click',function(){frame.style.width=button.dataset.width+'px';document.querySelectorAll('[data-width]').forEach(function(b){b.setAttribute('aria-pressed',String(b===button));});setTimeout(check,180);});});</script></body></html>
